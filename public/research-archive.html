const escapeEco=(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function economy(){return `<div class="shell eco-shell"><button class="back" onclick="nav('home')">← Dashboard</button><div class="eyebrow" style="margin-top:18px">01 / ECONOMY & INFLATION</div><div class="eco-top"><div><h2>What changed for India's economy?</h2><p class="eco-sub">Choose one of six subjects to explore the data, promises and evidence.</p></div><span class="eco-stage">Research in progress · 2014–2026</span></div><section class="eco-six" aria-label="Six economic subcategories">${ecoData.topics.map((t,i)=>`<button class="eco-tile ${ecoTopic===t.id?'selected':''}" onclick="selectEco('${t.id}')"><span class="eco-num">0${i+1}</span><span class="eco-ico">${t.icon}</span><strong>${escapeEco(t.name)}</strong><span class="eco-arrow">Explore →</span></button>`).join('')}</section><div id="ecoWorkspace"></div><div class="eco-footer">Numbers are source-specific observations, not an overall assessment of any government. <button onclick="nav('methods')">Methodology →</button></div></div>`}
function selectEco(topic){ecoTopic=topic;ecoMetric=ecoData.metrics.find(m=>m.topic===topic)?.id||null;ecoMode='trend';render();const node=document.getElementById('ecoWorkspace');if(node)node.scrollIntoView({block:'nearest',behavior:'smooth'})}
function ecoLine(series){if(!series?.length)return '';const width=700,height=236,left=52,right=25,top=25,bottom=44,vals=series.map(x=>Number(x[1])),min=Math.min(...vals),max=Math.max(...vals),spread=Math.max(max-min,Math.abs(max)*.1,1),lo=min-spread*.12,hi=max+spread*.12;const point=(d,i)=>[left+(width-left-right)*i/Math.max(1,series.length-1),top+(height-top-bottom)*(hi-d[1])/(hi-lo)];const pts=series.map(point);return `<svg class="eco-svg" viewBox="0 0 ${width} ${height}" role="img" aria-label="Interactive series chart"><path d="M${left} ${height-bottom}H${width-right}" stroke="#dcd5d5" fill="none"/><path d="${pts.map((p,i)=>(i?'L':'M')+p.join(' ')).join(' ')}" fill="none" stroke="#743a51" stroke-width="3" stroke-linejoin="round"/>${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="#743a51"><title>${escapeEco(series[i][0])}: ${series[i][1]}</title></circle>`).join('')}${pts.map((p,i)=>`<text x="${p[0]}" y="${height-15}" text-anchor="middle" fill="#706b77" font-size="${series.length>4?10:12}">${escapeEco(series[i][0])}</text>`).join('')}</svg>`}
function ecoCompare(m){let s=m.series;if(s.length<2)return '<p>Insufficient comparable observations.</p>';let first=s[0],last=s[s.length-1],delta=last[1]-first[1],pct=first[1]!==0?delta/Math.abs(first[1])*100:null;return `<div class="eco-compare"><div><small>${escapeEco(first[0])}</small><b>${first[1].toLocaleString('en-IN')}</b></div><span>→</span><div><small>${escapeEco(last[0])}</small><b>${last[1].toLocaleString('en-IN')}</b></div></div><p class="eco-note">Difference: ${delta>0?'+':''}${Number(delta.toFixed(2)).toLocaleString('en-IN')} ${escapeEco(m.unit)}${pct===null?'':` · ${pct>0?'+':''}${pct.toFixed(1)}% relative change`}. Earlier and later observations do not establish causation.</p>`}
function ecoChart(m){if(ecoMode==='trend')return ecoLine(m.series);if(ecoMode==='compare')return ecoCompare(m);if(ecoMode==='before')return m.series.some(s=>/2011|2013|2014/.test(s[0]))?`${ecoCompare(m)}<p class="eco-note">This comparison is not automatically an equal-length pre/post-2014 growth-rate comparison.</p>`:'<p class="eco-empty">A compatible pre-2014 baseline is not available for this series. No values have been fabricated.</p>';return '<p class="eco-empty">International peer observations have not yet been verified for this indicator. Consult the underlying source and comparisons register.</p>'}
function ecoSources(ids){return (ids||[]).map(id=>{let s=ecoData.sources[id];return s?`<a target="_blank" rel="noopener noreferrer" href="${escapeEco(s.url)}">${escapeEco(s.name)} ↗</a>`:''}).join('')}
function ecoDraw(){const root=document.getElementById('ecoWorkspace');if(!root)return;if(!ecoTopic){root.innerHTML='<div class="eco-prompt">↑ Select a category to open its interactive research dashboard.</div>';return}const topic=ecoData.topics.find(t=>t.id===ecoTopic),ms=ecoData.metrics.filter(m=>m.topic===ecoTopic),m=ms.find(x=>x.id===ecoMetric)||ms[0],ps=ecoData.promises.filter(p=>p.topic===ecoTopic);root.innerHTML=`<section class="eco-work"><div class="eco-workhead"><div><span class="eyebrow">${escapeEco(topic.short)} / DATA EXPLORER</span><h3>${escapeEco(topic.question)}</h3><p>${escapeEco(topic.desc)}</p></div><button class="eco-close" onclick="ecoTopic=null;ecoMetric=null;render()">Close ✕</button></div><div class="eco-kpis"><div><strong>${ms.length}</strong><span>Available indicators</span></div><div><strong>${ps.length}</strong><span>Linked commitments</span></div><div><strong>${ms.filter(x=>x.series.length).length}</strong><span>With observations</span></div></div><div class="eco-visual"><div class="eco-visual-head"><label for="ecoIndicator">Select indicator</label><select id="ecoIndicator" onchange="ecoMetric=this.value;ecoDraw()">${ms.map(x=>`<option value="${escapeEco(x.id)}" ${x.id===m.id?'selected':''}>${escapeEco(x.title)}</option>`).join('')}</select></div><div class="eco-tabs">${[['trend','Trend'],['compare','Before / after'],['before','Pre-2014 context'],['peers','Peers']].map(([id,name])=>`<button class="${ecoMode===id?'active':''}" onclick="ecoMode='${id}';ecoDraw()">${name}</button>`).join('')}</div><div class="eco-plot"><h4>${escapeEco(m.title)}</h4><small>${escapeEco(m.unit)} · ${escapeEco(m.type)}</small>${ecoChart(m)}</div><div class="eco-conclusion"><b>What the evidence shows</b><p>${escapeEco(m.summary)}</p><button class="eco-detailsbtn" onclick="toggleEco('ecoIndicatorDetails')">Methodology & sources +</button><div class="eco-detailpane" id="ecoIndicatorDetails" hidden><p>${escapeEco(m.method)}</p><p><strong>Evidence confidence:</strong> ${escapeEco(m.confidence)}</p><div class="eco-sources">${ecoSources(m.sources)}</div></div></div></div><div class="eco-promises"><div class="eco-listtitle"><h4>Related government commitments</h4><span>${ps.length} records</span></div>${ps.map(p=>`<details class="eco-promise"><summary><span><b>${escapeEco(p.title)}</b><small>${escapeEco(p.sourceClass)} · ${escapeEco(p.deadline)}</small></span><span class="eco-p-status">${escapeEco(p.status)}</span></summary><div><p>${escapeEco(p.analysis)}</p><p class="eco-note">${escapeEco(p.caveat)}</p><div class="eco-sources">${ecoSources(p.sources)}</div></div></details>`).join('')||'<p>Research commitments not yet catalogued.</p>'}</div><div class="eco-advanced"><button onclick="toggleEco('ecoAdvanced')">Open full research files & downloads ↓</button><div id="ecoAdvanced" hidden><a href="economy-evidence.html">Detailed Economy Evidence Explorer ↗</a><a href="data/economic_promises_audit.csv" download>Manifesto promise audit CSV ↓</a><a href="data/verified_comparisons_v13.csv" download>Verified comparisons CSV ↓</a><a href="data/comparison_protocols.csv" download>Comparison methodology CSV ↓</a></div></div></section>`}
function toggleEco(id){const el=document.getElementById(id);if(el)el.hidden=!el.hidden}

2057970&lang=2&reg=48", "explain": "Participation rose in the PLFS series. Paid work, unpaid household enterprise participation, and quality of employment need separate evaluation."}, {"title": "Female worker population ratio", "unit": "%", "points": [["2017–18", 22], ["2018–19", 23.3], ["2019–20", 28.7], ["2020–21", 31.4], ["2021–22", 31.7], ["2022–23", 35.9], ["2023–24", 40.3]], "source": "https://www.pib.gov.in/Pressreleaseshare.aspx?PRID=2057970&lang=2&reg=48", "explain": "A higher worker ratio does not establish adequate earnings or causal attribution to a single government."}]}, {"id": "commitments", "name": "Employment commitments", "icon": "✓", "question": "What employment promises were delivered?", "description": "Recruitment, skills and livelihood programmes", "metrics": [], "note": "Original wording, deadlines and independently corroborated outcomes are required. Consult the searchable promise audit for existing records."}], "democracy": [{"id": "rights", "name": "Political rights & civil liberties", "icon": "⚖", "question": "How do published rights assessments describe India?", "description": "External indices with methodology notes", "metrics": [{"title": "Freedom House overall score (2025)", "unit": "out of 100", "points": [["2024 edition", 66], ["2025 edition", 63]], "source": "https://freedomhouse.org/country/india/freedom-world/2025", "explain": "Freedom House classifies India as Partly Free in its 2025 edition. This is an expert-assessed index, not an objectively measured government performance percentage; editions are labelled, not assumed identical to calendar years."}]}, {"id": "speech", "name": "Press & expression", "icon": "◉", "question": "What is documented about speech and press freedom?", "description": "Court orders, journalist incidents and independent assessments", "metrics": [], "note": "Specific events require independently checked chronology, policing records and response from implicated authorities. An overall numeric verdict is withheld."}, {"id": "protests", "name": "Protest & assembly", "icon": "♧", "question": "How have restrictions on assembly been applied?", "description": "Incident documentation and legal outcomes", "metrics": [], "note": "A reliable nationwide incident register and official response review have not yet been compiled."}, {"id": "institutions", "name": "Institutional independence", "icon": "▥", "question": "How are oversight institutions functioning?", "description": "Judiciary, commissions and executive accountability", "metrics": [], "note": "Institution-level records need separate criteria; a single mixed score would be misleading."}, {"id": "finance", "name": "Political finance & transparency", "icon": "◇", "question": "How transparent is political funding?", "description": "Electoral bonds and related court decisions", "metrics": [], "note": "The Supreme Court struck down the electoral bonds scheme in February 2024. This is a legal finding about that scheme, not a full index of political financing."}, {"id": "shutdowns", "name": "Internet restrictions", "icon": "⌁", "question": "How often has internet access been deliberately interrupted?", "description": "Access Now KeepItOn recorded events", "metrics": [{"title": "Recorded internet shutdowns in India", "unit": "incidents", "points": [["2023", 116], ["2024", 84]], "source": "https://www.accessnow.org/press-release/keepiton-internet-shutdowns-2024-en/", "explain": "Access Now recorded 116 in 2023 and 84 in 2024. Incident counts are not equivalent to total affected people, geographical area or duration; state and Union authority must be differentiated."}]}]};
let researchSelections={employment:null,democracy:null},researchMetric=0;
function researchCategory(id){const c=cats.find(x=>x[0]===id),topics=additionalResearch[id];return `<div class="shell eco-shell"><button class="back" onclick="nav('home')">← Dashboard</button><div class="eyebrow" style="margin-top:18px">${id==='employment'?'02':'03'} / ${escapeEco(c[1].toUpperCase())}</div><div class="eco-top"><div><h2>${id==='employment'?'What is changing in India’s working lives?':'How are democratic rights and institutions evolving?'}</h2><p class="eco-sub">Choose a subject to explore the evidence; detailed sources open on demand.</p></div><span class="eco-stage">Selected research · Not a complete verdict</span></div><section class="eco-six" aria-label="Six subcategories">${topics.map((t,i)=>`<button class="eco-tile ${researchSelections[id]===t.id?'selected':''}" onclick="selectResearch('${id}','${t.id}')"><span class="eco-num">0${i+1}</span><span class="eco-ico">${escapeEco(t.icon)}</span><strong>${escapeEco(t.name)}</strong><span class="eco-arrow">Explore →</span></button>`).join('')}</section><div id="researchWorkspace"></div><div class="eco-footer">Source-specific observations and court records are not government-wide scores. <button onclick="nav('methods')">Methodology →</button></div></div>`}
function selectResearch(id,topic){researchSelections[id]=topic;researchMetric=0;render();document.querySelector('#researchWorkspace')?.scrollIntoView({behavior:'smooth',block:'nearest'})}
function chooseResearchMetric(i){researchMetric=i;drawResearch()}
function researchChart(m){return ecoLine(m.points)}
function drawResearch(){const root=document.querySelector('#researchWorkspace');if(!root)return;const id=new URLSearchParams(location.search).get('view'),selected=researchSelections[id];if(!selected){root.innerHTML='<div class="eco-prompt">↑ Select a subject to see evidence and comparisons.</div>';return}const t=additionalResearch[id].find(x=>x.id===selected);const m=t.metrics[researchMetric];root.innerHTML=`<section class="eco-work"><div class="eco-workhead"><div><span class="eyebrow">${escapeEco(t.name)} / EVIDENCE EXPLORER</span><h3>${escapeEco(t.question)}</h3><p>${escapeEco(t.description)}</p></div><button class="eco-close" onclick="researchSelections['${id}']=null;render()">Close ✕</button></div>${m?`<div class="eco-visual"><div class="eco-visual-head"><label>Choose indicator</label><select onchange="chooseResearchMetric(Number(this.value))">${t.metrics.map((x,i)=>`<option value="${i}" ${i===researchMetric?'selected':''}>${escapeEco(x.title)}</option>`).join('')}</select></div><div class="eco-plot"><h4>${escapeEco(m.title)}</h4><small>${escapeEco(m.unit)}</small>${researchChart(m)}</div><div class="eco-conclusion"><b>What the evidence shows</b><p>${escapeEco(m.explain)}</p><button class="eco-detailsbtn" onclick="toggleEco('researchDetails')">View original source & limitations +</button><div id="researchDetails" hidden><p>Period and classification: ${escapeEco(t.description)}. Older historical observations are not silently combined with these series.</p><div class="eco-sources"><a href="${escapeEco(m.source)}" target="_blank" rel="noopener noreferrer">Original published source ↗</a></div></div></div></div>`:`<div class="eco-visual"><h4>Evidence review in progress</h4><p>${escapeEco(t.note)}</p><button class="eco-detailsbtn" onclick="nav('audit')">Browse the existing promise audit ↗</button></div>`}<div class="eco-advanced"><button onclick="toggleEco('researchFoot')">Research scope & downloads ↓</button><div id="researchFoot" hidden><p>This is a selected, source-linked research sample; it is not a systematic assessment of all 2014–2026 claims.</p><a href="${id}data/-indicators.csv" download>Download observations CSV ↓</a><a href="${id}data/-research.json" download>Download research JSON ↓</a></div></div></section>`}
function category(id){const c=cats.find(x=>x[0]===id);return `<div class="shell"><button class="back" onclick="nav('home')">← Dashboard</button><div class="eyebrow" style="margin-top:25px">Research category</div><h2>${c[2]} ${c[1]}</h2><p class="lead">${c[3]}. This category's full systematic evidence review has not yet been completed.</p><div class="block"><div class="kicker">Current status</div><h3>Research preview — detailed audit pending</h3><p>Browse the existing evidence sample or original promise register. This category is not being presented as fully researched.</p><div class="tools">${link('Original category research','research-archive.html?view='+id,true)}${link('Promise register','?view=audit')}</div></div></div>`}
function audit(){return `<div class="shell"><button class="back" onclick="nav('home')">← Dashboard</button><div class="eyebrow" style="margin-top:25px">Evidence and accountability</div><h2>The Promise Audit</h2><p class="lead">A curated register of 82 manifesto commitments. The catalogue is not exhaustive; reviewed records must be distinguished from promises still awaiting source and outcome checks.</p><div class="statgrid"><div class="stat"><label>Catalogued</label><strong>82</strong></div><div class="stat"><label>Reviews in previous audit</label><strong>24</strong></div><div class="stat"><label>Government-wide score</label><strong>—%</strong></div></div><div class="tools">${link('Search the original audit interface','research-archive.html?view=audit',true)}${link('Download underlying promise data','data/promise_database.csv')}${link('Evaluation principles','?view=methods')}</div><div class="info">Implementation of a scheme is not proof of intended outcomes. A missed commitment does not by itself establish intentional deception. The delivery percentage is withheld until the reviewed sample is sufficiently comprehensive and representative.</div></div>`}
function methods(){return `<div class="shell"><button class="back" onclick="nav('home')">← Dashboard</button><div class="eyebrow" style="margin-top:25px">Research transparency</div><h2>How we evaluate evidence</h2><div class="block"><h3>1. Verify the exact promise</h3><p>Identify original source, date, responsibility, units, deadline and whether the wording is verbatim or paraphrased.</p><h3>2. Separate promises from outcomes</h3><p>A fulfilled policy announcement is not necessarily a fulfilled outcome. Assess measurable changes independently.</p><h3>3. Compare like with like</h3><p>Check denominators, currency, inflation adjustments, statistical base years and survey methodologies. Do not splice incompatible series.</p><h3>4. Include supporting and challenging evidence</h3><p>Review official releases alongside independent research and methodological limitations. Show unresolved discrepancies.</p><h3>5. Explain uncertainty and attribution</h3><p>National changes can reflect earlier programmes, state governments, private action and global economic conditions.</p><h3>6. Make results reproducible</h3><p>Publish source URLs, observation inputs, comparison protocols and scripts. Do not infer government-wide scores from a selected sample.</p></div><div class="tools">${link('Download calculation code','recompute_v13.py')}${link('Download numerical inputs','data/verified_comparisons_v13.csv')}${link('Full legacy methodology','research-archive.html?view=methods')}</div></div>`}
function render(){let view=new URLSearchParams(location.search).get('view')||'home';app.innerHTML=view==='home'?home():view==='economy'?economy():(view==='employment'||view==='democracy')?researchCategory(view):view==='audit'?audit():view==='methods'?methods():cats.some(c=>c[0]===view)?category(view):home();document.querySelectorAll('.links a').forEach(a=>a.classList.toggle('active',a.getAttribute('href')==='?view='+view));if(view==='economy')ecoDraw();if(view==='employment'||view==='democracy')drawResearch();window.scrollTo(0,0)};render();
</script>
<style>
.indev{margin:14px 0 24px;border:1px solid var(--border);border-radius:16px;background:#fff;overflow:hidden}.indev summary{cursor:pointer;list-style:none;padding:17px 20px;font-weight:750;display:flex;justify-content:space-between;align-items:center;gap:12px}.indev summary::-webkit-details-marker{display:none}.indev summary small{font-weight:500;color:var(--muted);font-size:12px}.indev-body{padding:0 18px 16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:12px}.indev-card{padding:15px;border:1px solid var(--border);border-radius:12px;background:#fcfaf6}.indev-card h4{margin:8px 0;font-size:15px}.indev-card p{font-size:13px;line-height:1.5;margin:8px 0}.indev-card .meta{font-size:11px;color:var(--maroon);font-weight:700}.indev-card a{color:#743a51;font-size:12px;font-weight:700}.indev-flag{margin:0 18px 16px;font-size:12px;color:var(--muted)}
</style>
<script>
const independentEvidence = [{"id": "IND-ECO-01", "category": "economy", "topic": "poverty", "title": "Income and wealth concentration, 2022–23", "source": "World Inequality Lab", "kind": "Independent academic estimation", "url": "https://wid.world/wp-content/uploads/2024/03/WorldInequalityLab_WP2024_09_Income-and-Wealth-Inequality-in-India-1922-2023_Final.pdf", "finding": "Estimates the top 1% received 22.6% of national income and held 40.1% of wealth in 2022–23.", "official": "Consumption-based poverty estimates and distributional measures are not the same quantities as pre-tax income or wealth shares.", "reconciliation": "Both a fall in measured consumption poverty and high income/wealth concentration can coexist. Compare definitions, reference years and modelling assumptions; do not subtract one measure from another.", "status": "Supplementary evidence; no causal finding"}, {"id": "IND-EMP-01", "category": "employment", "topic": "unemployment", "title": "Improving headline labour indicators versus quality of employment", "source": "ILO and Institute for Human Development", "kind": "Independent interpretation of official survey microdata", "url": "https://researchrepository.ilo.org/esploro/outputs/report/India-employment-report-2024-youth-employment/995360092402676", "finding": "2024 employment report characterises recent improvements in labour indicators as paradoxical, emphasising the quality and structure of available jobs.", "official": "PLFS unemployment and labour participation rates describe specific survey definitions, not adequate pay or job security.", "reconciliation": "PLFS headline improvement is not disproved by the ILO/IHD report: the report uses official labour surveys but raises distinct quality and youth-employment concerns. Not statistically independent primary collection.", "status": "Corroboration plus qualification"}, {"id": "IND-EMP-02", "category": "employment", "topic": "youth", "title": "Youth employment and skills mismatch", "source": "ILO and Institute for Human Development", "kind": "Independent expert research using official microdata", "url": "https://www.ihdindia.org/research/growth-and-employment/india-employment-report-2024-jobs-education-and-skills-for-the-youth/", "finding": "Investigates educated youth labour-market outcomes and skills mismatch over two decades.", "official": "Aggregate unemployment rates can mask age and educational differences.", "reconciliation": "Compare youth-specific and education-specific denominators rather than projecting all-age unemployment results onto young graduates.", "status": "Methodological qualification"}, {"id": "IND-DEM-01", "category": "democracy", "topic": "internet", "title": "Internet shutdowns: 2023 versus 2024", "source": "Access Now / #KeepItOn", "kind": "Independent civil society event monitoring", "url": "https://www.accessnow.org/internet-shutdowns-2024/", "finding": "Documented at least 116 shutdowns in India in 2023 and 84 in 2024.", "official": "An event-monitoring count is not identical to the number of formal government orders. Attribution to Union versus state authorities must be recorded separately.", "reconciliation": "The independently recorded count decreased between the two years, but remained substantial. It alone cannot measure all civil liberties or the motives of each order.", "status": "Documented trend within source methodology"}, {"id": "IND-DEM-02", "category": "democracy", "topic": "political", "title": "Electoral bonds: judicial finding", "source": "Supreme Court of India", "kind": "Judicial primary record (not independent statistical study)", "url": "https://www.webapi.sci.gov.in/supremecourt/2024/10382/10382_2024_1_301_51365_Judgement_11-Mar-2024.pdf", "finding": "Supreme Court order records the February 2024 holding that electoral-bond nondisclosure violated citizens’ right to information and the unlimited corporate donation amendment was arbitrary.", "official": "The scheme was enacted as a policy mechanism; implementation itself did not establish constitutional compliance.", "reconciliation": "A court holding establishes a specific legal conclusion, not a quantitative measure of the overall health of democracy or proof of individual corrupt conduct.", "status": "Documented judicial decision"}, {"id": "IND-DEM-03", "category": "democracy", "topic": "finance", "title": "Political finance and electoral-bond transparency", "source": "Supreme Court of India", "kind": "Judicial primary record", "url": "https://www.webapi.sci.gov.in/supremecourt/2024/10382/10382_2024_1_301_51365_Judgement_11-Mar-2024.pdf", "finding": "The Court ordered disclosure of electoral-bond purchasing and redemption data after the February 2024 judgment.", "official": "Claims that electoral bonds improved transparency must distinguish anonymous issuance from eventual court-ordered disclosures.", "reconciliation": "Records establish a constitutional transparency failure under the judgment; they do not alone determine motives of donors or recipients.", "status": "Documented judicial decision"}];
function independentEvidencePanel(view){const r=independentEvidence.filter(x=>x.category===view);if(!r.length)return '';const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));return `<details class="indev"><summary><span>Independent evidence & reconciliation <small>· ${r.length} reviewed source records</small></span><span>Open ↓</span></summary><div class="indev-body">${r.map(x=>`<article class="indev-card"><div class="meta">${esc(x.kind)} · ${esc(x.status)}</div><h4>${esc(x.title)}</h4><p><b>Finding:</b> ${esc(x.finding)}</p><p><b>Compared with official data:</b> ${esc(x.official)}</p><p><b>Assessment:</b> ${esc(x.reconciliation)}</p><a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">Original source ↗</a></article>`).join('')}</div><div class="indev-flag">Research notes are source-specific. An independent interpretation of official microdata is not an independent survey. No evidence here implies a whole-government score.</div></details>`}
const originalEcoDraw=ecoDraw;ecoDraw=function(){originalEcoDraw();const root=document.getElementById('ecoWorkspace');if(root&&ecoTopic){root.insertAdjacentHTML('beforeend',independentEvidencePanel('economy'));}};
const originalDrawResearch=drawResearch;drawResearch=function(){originalDrawResearch();const root=document.getElementById('researchWorkspace');const view=new URLSearchParams(location.search).get('view');if(root&&researchSelections[view])root.insertAdjacentHTML('beforeend',independentEvidencePanel(view));};
if(new URLSearchParams(location.search).get("view")==="economy" && ecoTopic)ecoDraw();if(["employment","democracy"].includes(new URLSearchParams(location.search).get("view")) && researchSelections[new URLSearchParams(location.search).get("view")])drawResearch();
</script>
</body></html>
